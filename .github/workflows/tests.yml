name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          # the lowest version in requires-python
          - os: ubuntu-latest
            python: "3.10"
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          # all commits and tags for the version, but only the files of the package
          # and its tests: the training data make up most of the repository
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            src/ae_pocketminer
            tests

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # the install dtand uses: no lock file, only the bounds in pyproject.toml
      - name: Install ae-pocketminer as a uv tool
        run: |
          uv tool install --python ${{ matrix.python }} .
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Run ae-pocketminer
        run: ae-pocketminer tests/fixtures/2ptc.cif -o out -j

      - name: Tests
        run: uv run --locked pytest -v

      - name: Wheel holds both checkpoints
        run: |
          uv build --wheel --out-dir dist
          uv run --no-project python - <<'EOF'
          import glob, zipfile
          wheel = zipfile.ZipFile(glob.glob("dist/*.whl")[0])
          data = [info for info in wheel.infolist() if ".data-" in info.filename]
          for info in data:
              print(info.filename, info.file_size)
          assert len(data) == 2 and all(info.file_size > 2**20 * 5 for info in data)
          EOF

  # a wheel on the GitHub release of each tag: installing it does not clone the
  # repository, whose history holds about 340 MB of training data
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            src/ae_pocketminer
            tests

      - uses: astral-sh/setup-uv@v6

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" dist/*.whl --clobber
